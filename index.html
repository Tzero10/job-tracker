<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d78"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="就活管理"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>就活管理 | 企業・選考記録</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#18283f;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #92b9ff;outline-offset:2px}.top{background:#173d78;color:white;padding:20px max(18px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:21px;margin:0}.top small{opacity:.75;font-size:12px}.wrap{max-width:1120px;margin:auto;padding:24px 18px 70px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}.bar h2{font-size:22px;margin:0}.muted{color:#6c7d92;font-size:13px}.btn{border:0;border-radius:11px;background:#1769e8;color:#fff;padding:11px 16px;font-weight:700}.btn.secondary{background:#e9f0fb;color:#214e8d}.btn.ghost{background:transparent;color:#48658a}.btn.danger{background:#ffebeb;color:#b32636}.btn.sm{font-size:13px;padding:8px 11px}.search{width:min(360px,100%);padding:12px;border:1px solid #d8e1ef;border-radius:11px;background:#fff}.card{background:#fff;border:1px solid #e1e8f2;border-radius:16px;box-shadow:0 5px 24px #173d7810}.company{padding:19px;margin:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px}.company h3{margin:0 0 9px;font-size:18px}.company p{margin:6px 0;line-height:1.6}.meta{font-size:13px;color:#53667f;overflow-wrap:anywhere}.meta a{color:#1769e8}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-block;background:#edf3ff;color:#2356a0;padding:4px 9px;border-radius:30px;font-size:12px;font-weight:700}.pill.green{background:#e5f8ed;color:#16824c}.pill.orange{background:#fff3de;color:#94620a}.pill.red{background:#ffeaec;color:#b32439}.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.number{font-size:12px;background:#edf1f7;border-radius:6px;padding:3px 7px;color:#52647b}.empty{text-align:center;padding:65px 20px;color:#64748b}.empty b{display:block;color:#203858;font-size:18px;margin-bottom:8px}.back{border:0;background:none;color:#1769e8;font-weight:700;padding:0 0 14px}.info{padding:20px;margin:16px 0}.info h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:13px;font-weight:700;color:#42536d}.field input,.field textarea,.field select{border:1px solid #d7e0ed;background:#fff;border-radius:10px;padding:11px;width:100%;min-width:0;color:#24364e}.field textarea{resize:vertical;min-height:76px}.field.full{grid-column:1/-1}.stages{display:flex;overflow-x:auto;gap:13px;padding:4px 2px 17px;scroll-snap-type:x proximity}.stage{flex:0 0 255px;padding:17px;scroll-snap-align:start}.stage h3{margin:0;font-size:16px}.stage .field{margin-top:13px}.stage-head{display:flex;justify-content:space-between;align-items:center}.add-stage{flex:0 0 140px;min-height:320px;border:2px dashed #bdd0ea;background:#f9fbff;border-radius:16px;color:#3168af;font-weight:700;font-size:15px}.notice{background:#e9f1ff;border-radius:12px;padding:12px 15px;color:#36577f;font-size:13px;line-height:1.6}.modal{position:fixed;inset:0;background:#15233e88;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.dialog{background:white;border-radius:18px;width:min(570px,100%);max-height:92vh;overflow-y:auto;padding:22px}.dialog h2{margin:0 0 18px}.footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.tools{display:flex;gap:8px;flex-wrap:wrap}.count{font-size:13px;color:#64748b}.hidden{display:none!important}@media(max-width:650px){.top{padding:17px}.top h1{font-size:19px}.wrap{padding:20px 13px 65px}.company{grid-template-columns:1fr}.actions{justify-content:flex-start}.grid{grid-template-columns:1fr}.bar h2{font-size:20px}.stage{flex-basis:82vw;max-width:300px}.dialog{padding:17px}.top small{display:none}}
</style></head><body><header class="top"><div><h1>📋 就活管理</h1><small>企業説明会・選考記録</small></div><button id="addTop" class="btn">＋ 企業追加</button></header><main class="wrap"><section id="listView"><div class="bar"><div><h2>企業一覧</h2><span class="count" id="count"></span></div><input id="search" class="search" type="search" placeholder="企業名・説明で検索"></div><div id="companies"></div><div class="tools" style="margin-top:24px"><button class="btn secondary sm" id="exportBtn">⬇ データをバックアップ</button><button class="btn secondary sm" id="importBtn">⬆ バックアップを復元</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="muted">データはこの端末のブラウザに保存されます。大切な記録は定期的にバックアップしてください。</p></section><section id="detailView" hidden><button class="back" id="back">← 企業一覧に戻る</button><div class="bar"><h2 id="detailTitle"></h2><button class="btn secondary sm" id="editCompany">企業情報を編集</button></div><div class="card info"><h3>企業・説明会情報</h3><div id="detailInfo"></div></div><div class="bar" style="margin-top:24px"><div><h2>選考記録</h2><div class="muted">右にスクロールして記録を追加できます →</div></div></div><div class="stages" id="stages"></div><p class="notice">選考内容は「書類選考」「面接」「筆記試験」「その他」から選択できます。「その他」を選ぶと自由入力欄が表示されます。変更は自動保存されます。</p></section></main><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle">企業を追加</h2><form id="companyForm"><p class="muted" style="margin:0 0 14px">企業名のみ必須です。住所・URL・説明会情報などは空欄のまま保存でき、後から編集できます。</p><div class="grid"><div class="field full"><label for="name">企業名 *</label><input id="name" required placeholder="例：株式会社サンプル"></div><div class="field full"><label for="address">企業住所（任意）</label><input id="address" placeholder="例：東京都千代田区…"></div><div class="field full"><label for="url">企業URL（任意）</label><input id="url" type="url" placeholder="https://example.com"></div><div class="field full"><label for="description">企業の簡単な説明（任意）</label><textarea id="description" placeholder="事業内容、企業の特徴など"></textarea></div><div class="field"><label for="reservation">説明会予約（任意）</label><select id="reservation"><option>未予約</option><option>予約済み</option><option>参加済み</option></select></div><div class="field"><label for="seminarAt">説明会日時（任意）</label><input id="seminarAt" type="datetime-local"></div></div><div class="footer"><button type="button" class="btn danger sm hidden" id="deleteCompany">企業を削除</button><button type="button" class="btn secondary" id="cancel">キャンセル</button><button type="submit" class="btn">保存</button></div></form></div></div><script>
const KEY='shukatsu-tracker-v1';let data=[],active=null,editing=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>String(Date.now())+Math.random().toString(36).slice(2,7);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(v)?v:[]}catch{data=[]}}function current(){return data.find(x=>x.id===active)}function fmt(s){if(!s)return '未設定';const d=new Date(s);return Number.isNaN(+d)?s:d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}function mapUrl(c){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((c.address||'').trim()||(c.name||'').trim())}function badge(s){return s==='参加済み'?'green':s==='予約済み'?'orange':''}function showList(){active=null;$('detailView').hidden=true;$('listView').hidden=false;renderList();history.replaceState(null,'',location.pathname+location.search)}function renderList(){const q=$('search').value.trim().toLowerCase();const filtered=data.map((c,i)=>({...c,num:i+1})).filter(c=>(c.name+' '+c.description).toLowerCase().includes(q));$('count').textContent=`${filtered.length} 社`;const box=$('companies');box.innerHTML=filtered.length?filtered.map(c=>{const url=safeUrl(c.url);return `<article class="card company"><div><div class="line"><span class="number">No. ${c.num}</span><h3>${esc(c.name)}</h3></div><p class="meta">📍 ${esc(c.address||'住所未登録')}　<a href="${esc(mapUrl(c))}" target="_blank" rel="noopener noreferrer" aria-label="Google マップで場所を検索">🗺 地図</a></p>${url?`<p class="meta">🌐 <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(c.url)}</a></p>`:''}<p>${esc(c.description||'企業説明なし')}</p><div class="line"><span class="pill ${badge(c.reservation)}">説明会：${esc(c.reservation||'未予約')}</span><span class="meta">🗓 ${esc(fmt(c.seminarAt))}</span></div></div><div class="actions"><button class="btn secondary sm" data-edit="${esc(c.id)}">編集</button><button class="btn sm" data-open="${esc(c.id)}">選考へ →</button></div></article>`}).join(''):`<div class="card empty"><b>${q?'該当する企業がありません':'企業を登録しましょう'}</b>${q?'検索条件を変えてください':'右上の「＋ 企業追加」から始められます。'}</div>`;box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(b.dataset.edit))}function openDetail(cid){active=cid;const c=current();if(!c)return showList();$('listView').hidden=true;$('detailView').hidden=false;$('detailTitle').textContent=c.name;const u=safeUrl(c.url);$('detailInfo').innerHTML=`<p><b>住所：</b>${esc(c.address||'未登録')}　<a class="btn secondary sm" href="${esc(mapUrl(c))}" target="_blank" rel="noopener noreferrer">📍 Google マップで開く ↗</a></p><p><b>URL：</b>${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(c.url)}</a>`:'未登録'}</p><p><b>企業説明：</b>${esc(c.description||'未登録')}</p><p><b>説明会：</b><span class="pill ${badge(c.reservation)}">${esc(c.reservation||'未予約')}</span>　${esc(fmt(c.seminarAt))}</p>`;renderStages();window.scrollTo(0,0)}function renderStages(){const c=current();if(!c)return;const el=$('stages');el.innerHTML=(c.stages||[]).map((s,i)=>`<article class="card stage" data-stage="${esc(s.id)}"><div class="stage-head"><h3>第${i+1}回選考</h3><button class="btn danger sm" data-remove="${esc(s.id)}" aria-label="選考を削除">✕</button></div><div class="field"><label>選考内容</label><select data-field="type"><option value="書類選考" ${s.type==='書類選考'?'selected':''}>書類選考</option><option value="面接" ${s.type==='面接'?'selected':''}>面接</option><option value="筆記試験" ${s.type==='筆記試験'?'selected':''}>筆記試験</option><option value="その他" ${s.type==='その他'?'selected':''}>その他</option></select></div><div class="field ${s.type==='その他'?'':'hidden'}" data-custom-wrap><label>その他の選考内容</label><input data-field="custom" value="${esc(s.custom||'')}" placeholder="例：SPI、Webテスト"></div><div class="field"><label>選考日時</label><input type="datetime-local" data-field="at" value="${esc(s.at||'')}"></div><div class="field"><label>選考結果</label><select data-field="result"><option ${s.result==='未定'?'selected':''}>未定</option><option ${s.result==='結果待ち'?'selected':''}>結果待ち</option><option ${s.result==='合格'?'selected':''}>合格</option><option ${s.result==='不合格'?'selected':''}>不合格</option></select></div><div class="field"><label>メモ</label><textarea data-field="memo" placeholder="面接内容、感想など">${esc(s.memo||'')}</textarea></div></article>`).join('')+`<button class="add-stage" id="addStage">＋<br>選考を追加</button>`;el.querySelectorAll('[data-stage]').forEach(card=>{const sid=card.dataset.stage;card.querySelectorAll('[data-field]').forEach(input=>{const update=()=>{const s=c.stages.find(x=>x.id===sid);if(!s)return;s[input.dataset.field]=input.value;save();if(input.dataset.field==='type')card.querySelector('[data-custom-wrap]').classList.toggle('hidden',input.value!=='その他')};input.addEventListener(input.tagName==='TEXTAREA'||input.dataset.field==='custom'?'input':'change',update)});card.querySelector('[data-remove]').onclick=()=>{if(confirm('この選考記録を削除しますか？')){c.stages=c.stages.filter(x=>x.id!==sid);save();renderStages()}}});$('addStage').onclick=()=>{c.stages??=[];c.stages.push({id:id(),type:'書類選考',custom:'',at:'',result:'未定',memo:''});save();renderStages();el.scrollTo({left:el.scrollWidth,behavior:'smooth'})}}function openModal(cid=null){editing=cid;const c=data.find(x=>x.id===cid);$('modalTitle').textContent=c?'企業情報を編集':'企業を追加';for(const key of ['name','address','url','description','reservation','seminarAt'])$(key).value=c?.[key]??(key==='reservation'?'未予約':'');$('deleteCompany').classList.toggle('hidden',!c);$('modal').classList.add('open');$('name').focus()}function closeModal(){$('modal').classList.remove('open');editing=null}$('companyForm').onsubmit=e=>{e.preventDefault();const obj={};for(const key of ['name','address','url','description','reservation','seminarAt'])obj[key]=$(key).value.trim();if(!obj.name)return;const old=data.find(x=>x.id===editing);if(old)Object.assign(old,obj);else data.push({...obj,id:id(),stages:[]});save();closeModal();if(active)openDetail(active);else renderList()};$('deleteCompany').onclick=()=>{if(!editing||!confirm('企業と選考記録をすべて削除しますか？'))return;data=data.filter(x=>x.id!==editing);save();closeModal();showList()};$('addTop').onclick=()=>openModal();$('cancel').onclick=closeModal;$('back').onclick=showList;$('editCompany').onclick=()=>openModal(active);$('search').oninput=renderList;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),companies:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shukatsu-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const arr=Array.isArray(parsed)?parsed:parsed.companies;if(!Array.isArray(arr)||!arr.every(c=>c&&typeof c.name==='string'&&typeof c.id==='string'))throw Error();if(confirm('現在のデータをバックアップの内容で置き換えますか？')){data=arr.map(c=>({...c,stages:Array.isArray(c.stages)?c.stages:[]}));save();showList()}}catch{alert('正しいバックアップファイルではありません。')}e.target.value=''};load();renderList();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
